[project]
name = "accountability-radar"
version = "0.1.0"
description = "OpenSverige Accountability Radar — ord mot handling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.23",
]

[project.optional-dependencies]
ingest = ["httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
